# One command: docker compose up
# SQL Server + two API instances sharing one database (SPEC §12).

x-api: &api
  build: .
  image: assignhub-api:local
  restart: on-failure
  depends_on:
    sqlserver:
      condition: service_healthy
  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ConnectionStrings__Default: "Server=sqlserver,1433;Database=AssignHub;User Id=sa;Password=AssignHub_Dev_Passw0rd;TrustServerCertificate=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AssignHub_Dev_Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api-1:
    <<: *api
    ports:
      - "5001:8080"

  api-2:
    <<: *api
    ports:
      - "5002:8080"

volumes:
  sqldata:
